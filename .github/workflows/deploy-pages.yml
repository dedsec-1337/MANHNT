name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble website assets
        run: |
          set -e
          cd website
          cat index.part1.html index.part2.html > index.html
          base64 -d apple-touch-icon.png.b64 > apple-touch-icon.png
          base64 -d og-image.jpg.b64 > og-image.jpg
          test -s index.html
          test -s apple-touch-icon.png
          test -s og-image.jpg
          test -f logo-mark.svg
          ls -la

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
